<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Padel Club"><meta name="theme-color" content="#D94A1C">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Swissquote Sports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: native-iOS single column (440px) with floating glass tab bar; admin widens to a sidebar console on desktop. */
:root{
  --bg:#E4E3E0; --surface:#FFFFFF; --surface-2:#F0EFEC; --ink:#121212; --ink-2:#5A5853; --ink-3:#8C8984;
  --line:rgba(18,18,18,.09); --accent:#EE5A2A; --accent-strong:#D94A1C; --accent-soft:rgba(238,90,42,.12);
  --hero:#141414; --hero-ink:#F4F3F0; --hero-2:#A8A49D;
  --c-tour:#EE5A2A; --c-init:#4A73A8; --c-spec:#D9952E; --c-big:#B8954F;
  --good:#2E8B57; --good-soft:rgba(46,139,87,.12); --warn:#B97A08; --warn-soft:rgba(185,122,8,.13); --bad:#C8372D; --bad-soft:rgba(200,55,45,.11);
  --glass:rgba(244,243,240,.82); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0B; --surface:#1A1A1C; --surface-2:#252528; --ink:#F4F3F0; --ink-2:#B4B1AB; --ink-3:#7F7C77;
  --line:rgba(255,255,255,.10); --accent:#FF6A3D; --accent-strong:#F25C2E; --accent-soft:rgba(255,106,61,.16);
  --hero:#1E1E21; --hero-ink:#F4F3F0; --hero-2:#A8A49D;
  --good:#4CB97A; --good-soft:rgba(76,185,122,.16); --warn:#E0A43A; --warn-soft:rgba(224,164,58,.16); --bad:#EF6A5F; --bad-soft:rgba(239,106,95,.15);
  --glass:rgba(26,26,28,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --surface:#1A1A1C; --surface-2:#252528; --ink:#F4F3F0; --ink-2:#B4B1AB; --ink-3:#7F7C77;
  --line:rgba(255,255,255,.10); --accent:#FF6A3D; --accent-strong:#F25C2E; --accent-soft:rgba(255,106,61,.16);
  --hero:#1E1E21; --hero-ink:#F4F3F0; --hero-2:#A8A49D;
  --good:#4CB97A; --good-soft:rgba(76,185,122,.16); --warn:#E0A43A; --warn-soft:rgba(224,164,58,.16); --bad:#EF6A5F; --bad-soft:rgba(239,106,95,.15);
  --glass:rgba(26,26,28,.78); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;padding:0 16px 120px;min-height:100%}
.screen{animation:push .28s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* nav */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;margin:0 -16px;padding-inline:16px;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}
.back{display:flex;align-items:center;gap:2px;color:var(--accent-strong);font-weight:500;font-size:17px;min-height:44px}
.back svg{width:22px;height:22px}
.topbar .tb-title{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.largetitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.largetitle h1{font-family:var(--f-display);font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);position:relative}
.iconbtn svg{width:20px;height:20px}
.dot-badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logo-sm{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:var(--shadow)}

/* sections */
.section{margin-top:28px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.section-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.section-h button{color:var(--accent-strong);font-size:15px;font-weight:500}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:50px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.cell .grow{flex:1;min-width:0}
.cell .sub{font-size:13px;color:var(--ink-3)}
.cell .val{color:var(--ink-3);font-size:15px;text-align:right}
.chev{width:8px;height:14px;color:var(--ink-3);flex:none}
.cell-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.cell-icon svg{width:17px;height:17px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:17px;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent-strong);color:#fff}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-tint{background:var(--accent-soft);color:var(--accent-strong)}
.btn-plain{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent-strong);font-weight:500}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.sptile{display:inline-flex;align-items:center;justify-content:center;background:var(--sc,#6E6A63);color:#fff;flex:none}
.sptile svg{display:block;flex:none}
.sportstrip{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 8px;margin:8px -16px 0;scrollbar-width:none}
.sportstrip::-webkit-scrollbar{display:none}
.spb{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;background:none;border:0;padding:0;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.spb.on .sptile{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--sc)}
.spb .sptile.add{background:var(--surface);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.sgb{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;background:var(--surface);border:2px solid transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.sgb.on{border-color:var(--sc);background:var(--surface-2)}
.sgb .tk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--sc);color:#fff;display:none;place-content:center}
.sgb.on .tk{display:grid}.sgb .tk svg{width:12px;height:12px}
.spn{font-weight:600}
.sprow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.sprow:first-of-type{border-top:0}
.chip.sm{height:30px;padding:0 8px}
.admrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.admrow:first-of-type{border-top:0}
.scopechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.4}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.b-tour{background:rgba(238,90,42,.14);color:var(--accent-strong)}
.b-init{background:rgba(74,115,168,.15);color:var(--c-init)}
.b-spec{background:rgba(217,149,46,.16);color:var(--warn)}
.b-big{background:rgba(184,149,79,.18);color:var(--c-big)}
.b-good{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-neutral{background:var(--surface-2);color:var(--ink-2)}
.b-accent{background:var(--accent-strong);color:#fff}
.catdot{width:8px;height:8px;border-radius:50%;flex:none}

/* hero */
.hero{position:relative;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px;overflow:hidden;box-shadow:var(--shadow);animation:rise .4s ease}
.hero .court{position:absolute;inset:0;opacity:.18;pointer-events:none}
.hero .court svg{width:100%;height:100%}
.still,.still .screen{animation:none!important}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.hero h3{font-family:var(--f-display);font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:10px 0 0;font-weight:800;text-transform:uppercase;max-width:70%}
.datebox{text-align:center;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 12px;min-width:68px}
.datebox .m{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.datebox .d{font-size:32px;font-weight:800;line-height:1;font-family:var(--f-display)}
.hero-meta{display:flex;gap:18px;margin-top:16px;color:var(--hero-2);font-size:14px;position:relative;flex-wrap:wrap}
.hero-meta b{color:var(--hero-ink);font-weight:600;display:block;font-size:15px}
.hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px;position:relative}
.bar{height:6px;border-radius:999px;background:rgba(127,127,127,.22);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .5s ease}
.bar.low>i{background:var(--warn)}
.bar.full>i{background:var(--bad)}
.hero .bar{background:rgba(255,255,255,.14)}

/* stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:16px;padding:14px 12px}
.stat .n{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}

/* event cards */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ecard{flex:none;width:236px;scroll-snap-align:start;background:var(--surface);border-radius:20px;overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.ecard:active{transform:scale(.98)}
.ecard .body{padding:12px 14px 14px;display:grid;gap:6px}
.ecard .t{font-weight:700;font-size:16px;line-height:1.2}
.ecard .s{font-size:13px;color:var(--ink-3)}
.art{position:relative;height:118px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px}
.art svg.lines{position:absolute;inset:0;width:100%;height:100%}
.art .big-d{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.9;letter-spacing:-.03em;position:relative}
.art .big-m{font-size:12px;font-weight:700;letter-spacing:.12em;position:relative;opacity:.9}
.art img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art.tournament{background:#E2552A}
.art.initiation{background:#3F679C}
.art.special{background:#D99232;color:#1A1205}
.art.big{background:#121212;color:#E3C88E}
.lcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow);transition:transform .15s}
.lcard:active{transform:scale(.985)}
.lcard .dcol{width:54px;height:62px;border-radius:12px;display:grid;place-content:center;text-align:center;flex:none;color:#fff}
.lcard .dcol .m{font-size:11px;font-weight:700;letter-spacing:.1em}
.lcard .dcol .d{font-size:24px;font-weight:800;line-height:1;font-family:var(--f-display)}
.lcard .t{font-weight:600;font-size:16px;line-height:1.25}
.lcard .s{font-size:13px;color:var(--ink-3);margin-top:2px}
.lcard .r{display:grid;justify-items:end;gap:6px;flex:none}
.stack{display:grid;gap:10px}
.month-h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 4px 8px}

/* event detail */
.ed-art{align-items:flex-start;height:260px;border-radius:0 0 28px 28px;margin:0 -16px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.ed-art h1{font-family:var(--f-display);font-size:34px;line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:0;position:relative;text-transform:uppercase;text-wrap:balance}
.ed-art .badge{position:relative;align-self:flex-start;background:rgba(255,255,255,.22);color:inherit;backdrop-filter:blur(8px)}
.ed-art.special .badge{background:rgba(0,0,0,.12)}
.ed-art .sub{position:relative;opacity:.85;font-size:15px}
.ed-floatback{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;z-index:5;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);color:#fff}
.ed-floatback svg{width:20px;height:20px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--surface);border-radius:14px;padding:12px 14px}
.fact .k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fact .v{font-weight:600;margin-top:3px}
.card{background:var(--surface);border-radius:18px;padding:16px}
.p{color:var(--ink-2);font-size:15px;line-height:1.5;margin:0}
.included{display:flex;flex-wrap:wrap;gap:8px}
.inc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500}
.inc svg{width:15px;height:15px;color:var(--good)}
.cta-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);z-index:30;display:flex;align-items:center;gap:12px}
.cta-price{flex:none}
.cta-price .k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cta-price .v{font-size:20px;font-weight:800;font-family:var(--f-display)}

/* pricing timeline */
.ptl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.pt{border-radius:12px;padding:10px;background:var(--surface-2);min-width:0}
.pt .lb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pr{font-family:var(--f-display);font-weight:800;font-size:20px;margin-top:2px}
.pt .dt{font-size:11px;color:var(--ink-3);margin-top:2px}
.pt.now{background:var(--accent-strong);color:#fff}
.pt.now .lb,.pt.now .dt{color:rgba(255,255,255,.82)}
.pt.past{opacity:.5}
.pt.past .pr{text-decoration:line-through}
.save{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.save .big{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),416px);height:64px;border-radius:32px;background:var(--glass);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.14);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}
.tab{display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent-strong)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,440px);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;z-index:61;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .32s cubic-bezier(.2,.9,.2,1)}
.sheet.wide{width:min(100%,640px)}
@keyframes sheet{from{transform:translate(-50%,40px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.4;margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sheet-h h2{font-size:20px;font-weight:700;margin:0}
.steps{display:flex;gap:4px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps i.on{background:var(--accent-strong)}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;background:var(--surface);text-align:left;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.choice.on{box-shadow:inset 0 0 0 2px var(--accent-strong)}
.choice .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.choice.on .radio{border-color:var(--accent-strong)}
.choice.on .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent-strong)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);padding-left:4px}
.input{width:100%;height:48px;border-radius:12px;border:0;background:var(--surface);padding:0 14px;box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.input[readonly]{color:var(--ink-3)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.3,1)}
.toggle input:checked+span{background:var(--good)}
.toggle input:checked+span::after{transform:translateX(20px)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent-strong);flex:none;margin:0}
.plchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface-2);margin:0 6px 6px 0;font-size:14px;font-weight:500}
.plchip small{font-size:12px;font-weight:400;color:var(--muted,#777)}
.pbanner{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45;text-align:left}
.pbanner svg{width:20px;height:20px;flex:none;margin-top:1px}
.pbanner b{display:block;font-size:15px;margin-bottom:2px}
.pbanner.wait{background:#FBF1DC;color:#7A5410}
.pbanner.ok{background:#DDF3E4;color:#1B6B38}
.invalid{box-shadow:0 0 0 2px var(--bad)!important;border-radius:12px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.n-warn{background:var(--warn-soft);color:var(--ink)}
.n-warn svg{color:var(--warn)}
.n-info{background:var(--surface-2);color:var(--ink-2)}
.n-bad{background:var(--bad-soft)}
.n-bad svg{color:var(--bad)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.sumrow+.sumrow{border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:1px solid var(--ink)}
.total .v{font-family:var(--f-display);font-size:30px;font-weight:800}

/* success */
.success{text-align:center;padding:18px 0 4px;display:grid;justify-items:center;gap:8px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--good);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.tick svg{width:44px;height:44px;color:#fff;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .2s ease forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.success h2{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;margin:10px 0 0}

/* pass */
.pass{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.pass .row{display:flex;justify-content:space-between;gap:12px}
.pass .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-2);font-weight:600}
.pass .v{font-weight:600}
.qr{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center;justify-self:center}
.qr svg{width:170px;height:170px;display:block}
.qr-code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;font-size:14px;text-align:center;color:var(--hero-2)}

/* ring & badges */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:96px;height:96px;flex:none}
.achv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{background:var(--surface);border-radius:14px;padding:12px 6px;text-align:center;display:grid;justify-items:center;gap:6px}
.ach .medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.ach .medal svg{width:20px;height:20px}
.ach.on .medal{background:var(--accent-strong);color:#fff}
.ach .t{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ach .s{font-size:11px;color:var(--ink-3)}
.ach:not(.on) .t{color:var(--ink-3)}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{width:40px;height:40px;color:var(--ink-3)}
.stars button.on{color:var(--accent-strong)}
.stars svg{width:32px;height:32px}
.empty{text-align:center;padding:30px 20px;color:var(--ink-3);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink);font-size:17px}
.empty svg{width:34px;height:34px;opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:90;display:flex;gap:8px;align-items:center;animation:rise .25s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast svg{width:18px;height:18px;color:var(--good)}
.demo-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface-2);padding:4px 10px;border-radius:999px}
details.faq{background:var(--surface);border-radius:14px;padding:0 16px}
details.faq+details.faq{margin-top:8px}
details.faq summary{list-style:none;padding:15px 0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.faq summary::-webkit-details-marker{display:none}
details.faq p{margin:0 0 14px;color:var(--ink-2);font-size:15px}
.minical{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mm{background:var(--surface);border-radius:16px;padding:10px;text-align:left;box-shadow:inset 0 0 0 2px transparent}
.mm.on{box-shadow:inset 0 0 0 2px var(--accent-strong)}
.mm .mt{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
.mm .dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mm .dg span{height:17px;font-size:9.5px;display:grid;place-items:center;color:var(--ink-3);border-radius:50%}
.mm .dg span.ev{color:#fff;font-weight:700}
.mm .dg span.past{opacity:.55}
.mm .dg span.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.open-hero{background:#0E0E0E;color:#E9DCC0;margin:0 -16px;padding:30px 20px 24px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.open-hero h1{font-family:var(--f-display);font-size:46px;line-height:.92;letter-spacing:-.035em;font-weight:800;margin:14px 0 0;position:relative;color:#F4F3F0}
.open-hero h1 span{color:#D9B877}
.open-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px;position:relative}
.open-stats div{border-top:1px solid rgba(217,184,119,.35);padding-top:8px}
.open-stats b{font-family:var(--f-display);font-size:30px;display:block;color:#F4F3F0;line-height:1}
.open-stats span{font-size:11px;letter-spacing:.1em;font-weight:600;color:#D9B877}
.countdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.countdown div{background:var(--surface);border-radius:14px;padding:12px 6px}
.countdown b{font-family:var(--f-display);font-size:28px;font-weight:800;display:block}
.countdown span{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.soon{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);padding:3px 8px;border-radius:6px}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl b{font-variant-numeric:tabular-nums}

/* ADMIN */
.admin{max-width:1180px;margin:0 auto;padding:0 16px 60px;min-height:100%}
.admin-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 -16px;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.admin-top .brand{display:flex;align-items:center;gap:10px;font-weight:700;flex:1;min-width:0}
.admin-top .brand small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.admin-layout{display:grid;gap:20px;padding-top:16px}
.side{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.side::-webkit-scrollbar{display:none}
.side button{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink-2);background:var(--surface)}
.side button svg{width:18px;height:18px}
.side button.on{background:var(--ink);color:var(--bg)}
@media (min-width:900px){
  .admin-layout{grid-template-columns:220px minmax(0,1fr);align-items:start;gap:28px}
  .side{flex-direction:column;position:sticky;top:84px;margin:0;padding:0;overflow:visible}
  .side button{background:none;height:40px}
  .side button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
}
.a-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.a-h h1{font-family:var(--f-display);font-size:30px;letter-spacing:-.02em;margin:0;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:16px;padding:16px;min-width:0}
.kpi .n{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.kpi .x{font-size:13px;color:var(--ink-3);margin-top:4px}
.acols{display:grid;gap:16px}
@media (min-width:900px){.acols.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.panel{background:var(--surface);border-radius:18px;padding:18px;min-width:0}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.qa{grid-template-columns:repeat(3,1fr)}}
.qa button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2);font-weight:600;font-size:14px;text-align:left}
.qa button svg{width:20px;height:20px;color:var(--accent-strong);flex:none}
.erow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.erow:first-child{border-top:0}
.erow .grow{flex:1;min-width:180px}
.erow .t{font-weight:600}
.erow .s{font-size:13px;color:var(--ink-3)}
.erow .fill{width:120px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.form-sec{background:var(--surface);border-radius:18px;padding:18px;display:grid;gap:14px}
.form-sec h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.form-sec .input{background:var(--bg)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.tier-ed{border-radius:14px;padding:14px;background:var(--bg);display:grid;gap:10px;box-shadow:inset 0 0 0 1px var(--line)}
.tier-ed.err{box-shadow:inset 0 0 0 2px var(--bad)}
.chf{position:relative}
.chf span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:15px;pointer-events:none}
.chf .input{padding-left:50px}
.err-t{color:var(--bad);font-size:13px;font-weight:600}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.12);margin-top:16px;z-index:10}
.prow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow:first-child{border-top:0}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink-2);flex:none}
.pinfo{flex:1;min-width:200px;display:grid;gap:4px}
.pinfo .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-3)}
.pinfo .meta b{color:var(--ink);font-weight:600}
.msgbox{width:100%;min-height:220px;border-radius:14px;border:0;padding:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;line-height:1.5;white-space:pre-wrap}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-ui)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bbar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative}
.bbar i{display:block;height:100%}
.bmark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.tablewrap{overflow-x:auto}
.ci-ring{display:flex;align-items:center;gap:18px}
.costin{width:100%;height:40px;border-radius:10px;border:0;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.login{max-width:400px;margin:0 auto;padding:24px 0 60px;display:grid;gap:18px}
.login .logo{width:96px;height:96px;border-radius:50%;justify-self:center;background:#fff;object-fit:cover;box-shadow:var(--shadow)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.g8{display:grid;gap:8px}.g12{display:grid;gap:12px}.g16{display:grid;gap:16px}
.w100{width:100%}

/* v2: clearer contrast + admin console */
.btn-light{background:rgba(255,255,255,.14);color:#fff}
.btn-white{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);gap:6px}
.hero{cursor:pointer;display:block;width:100%}
.intro{display:grid;gap:12px}
.intro-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.intro-steps div{background:var(--surface-2);border-radius:14px;padding:12px 10px;display:grid;gap:2px;font-size:14px;line-height:1.25}
.intro-steps span:not(.stepn){font-size:12px;color:var(--ink-3)}
.stepn{width:24px;height:24px;border-radius:50%;background:var(--accent-strong);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;margin-bottom:6px}
.sheet-q{margin:0 4px 14px;font-size:22px;font-weight:700}
.lcard,.card,.group,.stat,.fact,.ecard,.ach,.countdown div{box-shadow:var(--shadow)}
.admin-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:#161618;color:#F4F3F0;text-align:left}
.admin-card .chev{color:#8C8984}
.admin-pill{background:var(--accent-strong);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;padding:5px 9px;border-radius:7px}
.abnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.abnav button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.abnav button svg{width:24px;height:24px}
.abnav button.on{color:var(--accent)}
.admin{padding-bottom:110px}
@media (max-width:899px){.side{display:none}}
@media (min-width:900px){.abnav{display:none}.admin{padding-bottom:60px}}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.moregrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.moretile{display:grid;gap:6px;justify-items:start;text-align:left;padding:16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.moretile span{font-size:13px;color:var(--ink-3)}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:10px 0 8px}
.pin-dots i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3)}
.pin-dots i.on{background:var(--accent-strong);box-shadow:none}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{text-align:center;font-size:14px;color:var(--ink-3);margin-bottom:14px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keypad button{height:62px;border-radius:18px;background:var(--surface);font-size:26px;font-weight:600;box-shadow:var(--shadow);display:grid;place-items:center}
.keypad button:active{transform:scale(.95);background:var(--surface-2)}
.keypad button svg{width:24px;height:24px}
:root.adminmode{--bg:#111113;--surface:#1C1C1F;--surface-2:#28282C;--ink:#F4F3F0;--ink-2:#B9B6B0;--ink-3:#8A8781;--line:rgba(255,255,255,.10);--accent:#FF6A3D;--accent-strong:#F25C2E;--accent-soft:rgba(255,106,61,.16);--hero:#232327;--glass:rgba(17,17,19,.86);--good:#4CB97A;--good-soft:rgba(76,185,122,.16);--warn:#E0A43A;--warn-soft:rgba(224,164,58,.16);--bad:#EF6A5F;--bad-soft:rgba(239,106,95,.15);--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

/* v3: native iOS-style player lists */
.ltsub{font-size:13px;font-weight:600;color:var(--ink-3)}
.lh{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:24px 16px 7px}
.lh.row{display:flex}
.lh-link{color:var(--accent-strong);font-size:15px;font-weight:500;text-transform:none;letter-spacing:0}
.lfoot{font-size:13px;color:var(--ink-3);margin:7px 16px 0;line-height:1.4}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.list>*+*{border-top:.5px solid var(--line)}
.list .lrow+.lrow,.list .irow+.irow,.list .lrow+.irow,.list .irow+.lrow,.list .prow2+.prow2{border-top:0;box-shadow:inset 0 .5px 0 var(--line)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;min-height:56px;text-align:left;background:var(--surface);transition:background .12s}
button.lrow:active{background:var(--surface-2)}
.lmain{flex:1;min-width:0;display:grid;gap:2px}
.lmain b{font-size:16px;font-weight:600;line-height:1.25}
.lmain>span{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain .catdot{width:7px;height:7px;flex:none}
.dtile{width:44px;height:46px;border-radius:10px;background:var(--surface-2);display:grid;place-content:center;text-align:center;flex:none;line-height:1}

/* v4: covers, payments, scanner */
.c-tournament{background:#E2552A;color:#fff}.c-initiation{background:#3F679C;color:#fff}.c-special{background:#E09A34;color:#1A1205}.c-big{background:#141414;color:#E3C88E}

.dtile{box-shadow:0 2px 6px rgba(0,0,0,.12)}

.ev-cover p{position:relative;margin:0;opacity:.85;font-size:16px}
.ev-cover .nc-cat{position:absolute;top:16px;left:18px}
button.maplink{background:var(--accent-soft);padding:6px 12px;border-radius:999px;font-size:14px}
.payico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;font-size:12px;letter-spacing:.02em}
.payico svg{width:18px;height:18px}
.pay-twint{background:#000}.pay-card{background:#1A73E8}.pay-later{background:#8C8984}

.paytotal span{font-size:13px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.paytotal small{color:var(--ink-3)}
.testnote{display:flex;gap:8px;align-items:center;margin:12px 16px 0;font-size:13px;color:var(--ink-3)}

.linkish{background:none;border:0;text-align:left;color:var(--accent-strong);cursor:pointer;padding:0}

.twint{background:#000;color:#fff;border-radius:20px;padding:22px;display:grid;justify-items:center;gap:8px;text-align:center}
.tw-logo{font-weight:900;letter-spacing:.12em;font-size:18px}
.tw-amt{font-size:36px;font-weight:800}
.tw-qr{background:#fff;padding:12px;border-radius:12px;margin:8px 0}
.tw-qr svg{width:130px;height:130px;display:block}
.scanpanel{display:grid}
.scanbtn{display:grid;justify-items:center;gap:6px;text-align:center;padding:26px 16px;border-radius:18px;background:var(--accent-strong);color:#fff;cursor:pointer}
.scanbtn svg{width:46px;height:46px}

.scanres .list{background:var(--bg)}
.scanres .list .irow{background:var(--bg)}
.livechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);padding:6px 10px;border-radius:999px}

.livechip.on{color:var(--good)}.livechip.on i{background:var(--good)}

/* v5: scanner + TWINT handoff */
.scanbtn{border:0;font:inherit;width:100%}
.scanner{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr auto auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sc-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.sc-top b{display:block;text-align:center;font-size:17px}
.sc-top span{display:block;text-align:center;font-size:13px;color:#A8A49D}
.sc-x{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.sc-x svg{width:20px;height:20px}
.sc-view{position:relative;overflow:hidden;margin:0 16px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#2a2a2e,#0b0b0c);min-height:300px}
.sc-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.scanner.live .sc-view video{opacity:1}
.sc-mask{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 120px,rgba(0,0,0,.45) 121px)}
.sc-frame{position:absolute;left:50%;top:50%;width:min(64vw,250px);aspect-ratio:1;transform:translate(-50%,-50%)}
.sc-frame i{position:absolute;width:42px;height:42px;border:4px solid #F25C2E}
.sc-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.sc-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.sc-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.sc-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.sc-line{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#F25C2E,transparent);box-shadow:0 0 12px #F25C2E;animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:12%}50%{top:86%}}
.sc-msg{text-align:center;padding:16px 24px 6px;font-size:15px;color:#D8D5CF}
.sc-bottom{display:grid;justify-items:center;gap:12px;padding:10px 0 22px}
.sc-shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;cursor:pointer}
.sc-shutter span{width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .12s}
.sc-shutter:active span{transform:scale(.9)}
.scanner.live .sc-shutter{opacity:.35}
.sc-type{color:#fff;font-size:15px;font-weight:500;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12)}
.tw-app{position:fixed;inset:0;z-index:210;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);animation:fade .2s ease}
.tw-test{justify-self:center;margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#000;background:#FFD400;padding:5px 12px;border-radius:999px}
.tw-stage{display:grid;align-content:center;justify-items:center;gap:14px;text-align:center;max-width:380px;width:100%;margin:0 auto}
.tw-brand{font-weight:900;font-size:44px;letter-spacing:.14em}
.tw-brand.sm{font-size:20px;opacity:.9;margin-bottom:10px}
.tw-brand.pulse{animation:twp 1s ease-in-out infinite}
@keyframes twp{50%{opacity:.4}}
.tw-sub{color:#A8A49D;font-size:15px}
.tw-merchant{display:flex;align-items:center;gap:12px;background:#1C1C1E;border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.tw-merchant img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}
.tw-merchant b{display:block}
.tw-merchant span{font-size:14px;color:#A8A49D}
.tw-amount{font-size:52px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.tw-actions{display:grid;gap:10px;width:100%;margin-top:24px}
.tw-pay{height:56px;border-radius:16px;background:#fff;color:#000;font-size:18px;font-weight:700}
.tw-pay:active{transform:scale(.98)}
.tw-cancel{height:48px;border-radius:16px;color:#fff;background:#1C1C1E;font-weight:600}
.tw-done{display:grid;justify-items:center;gap:8px}
.tw-tick{width:84px;height:84px;border-radius:50%;background:#2E8B57;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.tw-tick svg{width:44px;height:44px}
.tw-done b{font-size:30px}

.largetitle>div:first-child{order:1}
.lt-logo{order:2;margin-left:auto;width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none;align-self:center}
.largetitle .avatar-btn{order:3}
.largetitle .logo-sm{display:none}
.tb-logo{width:32px;height:32px;border-radius:50%;background:#fff;object-fit:cover;display:block;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* v6: wallet pass, iPhone camera pairing, full-screen scan result */
.wpass{border-radius:22px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.22);display:grid}
.wp-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.wp-head img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
.wp-head b{display:block;font-size:14px;letter-spacing:.02em}
.wp-head span{font-size:12px;opacity:.8}
.wp-status{margin-left:auto;font-size:12px!important;font-weight:700;opacity:1!important;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:999px}

.wp-title{padding:6px 16px 10px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.wp-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px}

.wp-fields b{font-size:15px;font-weight:600}
.wp-qr{background:#fff;color:#141414;margin-top:12px;padding:18px 16px 16px;display:grid;justify-items:center;gap:6px;border-top:2px dashed rgba(0,0,0,.12)}

.wp-code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.16em;font-size:15px;font-weight:600}
.wp-hint{font-size:12px;color:#6E6A63}
.cam-card{display:flex;gap:18px;align-items:center;background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.cam-phone{width:122px;height:232px;border-radius:26px;background:#0b0b0c;padding:7px;flex:none;box-shadow:0 0 0 2px #2a2a2e,0 10px 24px rgba(0,0,0,.3)}
.cam-screen{height:100%;border-radius:20px;background:radial-gradient(circle at 50% 40%,#3a3a3f,#141416);position:relative;overflow:hidden;display:grid;place-items:center}
.cam-frame{position:relative;width:74px;height:74px;display:grid;place-items:center}
.cam-frame svg{width:48px;height:48px}
.cam-frame i{position:absolute;width:16px;height:16px;border:3px solid #FFD60A}
.cam-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cam-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.cam-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 6px}
.cam-frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 6px 0}
.cam-pill{position:absolute;bottom:16px;left:8px;right:8px;background:#FFD60A;color:#000;font-size:9.5px;font-weight:700;border-radius:999px;padding:5px 6px;display:flex;align-items:center;justify-content:center;gap:4px;animation:camp 2.4s ease-in-out infinite}
.cam-pill svg{width:10px;height:10px}
@keyframes camp{0%,30%{opacity:0;transform:translateY(6px)}45%,100%{opacity:1;transform:none}}
.cam-text h3{margin:4px 0 8px;font-size:19px}
.cam-text ol{margin:0 0 10px;padding-left:20px;display:grid;gap:4px;font-size:15px}
.sr-sheet{padding:0;max-height:96%;background:var(--bg)}
.sr-full{display:grid}
.sr-hero{display:grid;justify-items:center;text-align:center;gap:6px;padding:30px 20px 26px;color:#fff}
.sr-hero>svg{width:56px;height:56px}
.sr-hero b{font-size:26px;font-weight:800;letter-spacing:-.01em}
.sr-hero span{font-size:15px;opacity:.92}
.sr-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;font-weight:800;opacity:1!important}
.sr-full.good .sr-hero{background:linear-gradient(180deg,#2E8B57,#257347)}
.sr-full.in .sr-hero{background:linear-gradient(180deg,#4A73A8,#3B5F8E)}
.sr-full.bad .sr-hero{background:linear-gradient(180deg,#C8372D,#A82C24)}
.sr-body{padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sr-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sr-tile.warn svg,.sr-tile.warn b{color:var(--warn)}
.btn-xl{min-height:58px;font-size:18px}
button.avatar{cursor:pointer}

/* v7 */
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.twbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;border-radius:16px;background:#000;color:#fff;font-weight:600;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.twbtn:active{transform:scale(.98)}
.twbtn>span:nth-child(2){flex:1;text-align:left}
.twbtn .chev{color:#8C8984}
.tw-mark{background:#fff;color:#000;font-weight:900;font-size:11px;letter-spacing:.1em;padding:6px 8px;border-radius:8px}
.scanhero{display:grid;justify-items:center;gap:8px;text-align:center;padding:30px 18px 26px;border-radius:24px;background:radial-gradient(circle at 50% 0%,#3a3a3f,#141416 70%);color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .12s}

.scanhero b{font-size:22px}
.scanhero>span:last-of-type{font-size:14px;color:#BDB9B2;max-width:260px}
.sh-ring{width:132px;height:132px;border-radius:50%;background:rgba(242,92,46,.14);display:grid;place-items:center;margin-bottom:6px;animation:ring 2.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 14px rgba(242,92,46,.07)}}
.sh-frame{position:relative;width:84px;height:84px;display:grid;place-items:center;background:#F25C2E;border-radius:22px}
.sh-frame svg{width:44px;height:44px}
.sh-frame i{display:none}
.dropzone{display:grid;justify-items:center;gap:4px;text-align:center;padding:22px 14px;border-radius:14px;border:2px dashed var(--line);cursor:pointer;color:var(--ink-2)}
.dropzone svg{width:26px;height:26px;color:var(--accent-strong)}
.dropzone span{font-size:13px;color:var(--ink-3)}

const CROP_W=1600,CROP_H=900;
function cropSheet(s){return sheetHead("Frame the photo","Drag to move · slider to zoom")+'<div class="crop-frame" id="cropFrame"><img id="cropImg" src="'+s.src+'" alt="Photo to frame" draggable="false"><div class="crop-grid"><i></i><i></i><i></i><i></i></div><div class="crop-label">'+esc(S.admin.draft&&S.admin.draft.title||"Event")+'</div></div><div class="crop-ctrl"><span class="small muted">'+ic("search",'style="width:16px;height:16px"')+'</span><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="'+s.zoom+'" aria-label="Zoom"><span class="num small muted" id="cropPct">'+Math.round(s.zoom*100)+'%</span></div><div class="row wrap" style="justify-content:center;gap:8px"><button class="chip" data-act="cropreset">Reset</button><button class="chip" data-act="cropcenter">Center</button></div>'+(s.w<CROP_W||s.h<CROP_H?'<div class="notice n-warn mt12">'+ic("warn")+'<div>This photo is small ('+s.w+'×'+s.h+'). It may look soft on large screens; a photo of at least 1600×900 looks best.</div></div>':'<div class="small muted mt12" style="text-align:center">Saved as a sharp 1600×900 cover, optimised for phones.</div>')+'<div class="grid2 mt16"><button class="btn btn-plain" data-act="closesheet">Cancel</button><button class="btn btn-primary" data-act="cropsave">Use photo</button></div>';}
function cropGeo(){const s=S.sheet,f=document.getElementById("cropFrame");if(!s||!f)return null;const FW=f.clientWidth,FH=FW*CROP_H/CROP_W;const s0=Math.max(FW/s.w,FH/s.h);const sc=s0*s.zoom;const dw=s.w*sc,dh=s.h*sc;
  const mx=Math.max(0,(dw-FW)/2/FW),my=Math.max(0,(dh-FH)/2/FW);s.ox=Math.max(-mx,Math.min(mx,s.ox));s.oy=Math.max(-my,Math.min(my,s.oy));
  return {FW,FH,dw,dh,left:(FW-dw)/2+s.ox*FW,top:(FH-dh)/2+s.oy*FW};}
function layoutCrop(){const g=cropGeo();if(!g)return;const im=document.getElementById("cropImg");im.style.width=g.dw+"px";im.style.height=g.dh+"px";im.style.transform="translate("+g.left+"px,"+g.top+"px)";const p=document.getElementById("cropPct");if(p)p.textContent=Math.round(S.sheet.zoom*100)+"%";}
function bindCrop(){const f=document.getElementById("cropFrame");if(!f||f._b)return;f._b=1;layoutCrop();let drag=null;
  f.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,ox:S.sheet.ox,oy:S.sheet.oy};f.setPointerCapture&&f.setPointerCapture(e.pointerId);f.classList.add("dragging");});
  f.addEventListener("pointermove",e=>{if(!drag)return;const W=f.clientWidth;S.sheet.ox=drag.ox+(e.clientX-drag.x)/W;S.sheet.oy=drag.oy+(e.clientY-drag.y)/W;layoutCrop();});
  const end=()=>{drag=null;f.classList.remove("dragging");};f.addEventListener("pointerup",end);f.addEventListener("pointercancel",end);
  f.addEventListener("wheel",e=>{e.preventDefault();S.sheet.zoom=Math.max(1,Math.min(3,S.sheet.zoom-e.deltaY*0.002));const z=document.getElementById("cropZoom");if(z)z.value=S.sheet.zoom;layoutCrop();},{passive:false});
  const z=document.getElementById("cropZoom");z.addEventListener("input",()=>{S.sheet.zoom=+z.value;layoutCrop();});}
function openCrop(file){if(!/^image\//.test(file.type)){toast("Choose an image file");return;}if(file.size>25e6){toast("Choose an image under 25 MB");return;}
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{S.sheet={type:"crop",src:rd.result,w:img.naturalWidth,h:img.naturalHeight,zoom:1,ox:0,oy:0};render(true);};img.onerror=()=>toast("This image can’t be opened");img.src=rd.result;};rd.readAsDataURL(file);}
function saveCrop(){const s=S.sheet,g=cropGeo();if(!g)return;const k=CROP_W/g.FW;const cv=document.createElement("canvas");cv.width=CROP_W;cv.height=CROP_H;const cx=cv.getContext("2d");cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";
  const img=document.getElementById("cropImg");cx.fillStyle="#141414";cx.fillRect(0,0,CROP_W,CROP_H);cx.drawImage(img,g.left*k,g.top*k,g.dw*k,g.dh*k);
  let out;try{out=cv.toDataURL("image/jpeg",0.86);}catch(err){toast("Couldn’t process this image");return;}
  S.admin.draft.image=out;S.admin.draft.imageOrig=s.src;S.admin.draft.imageFrame={zoom:s.zoom,ox:s.ox,oy:s.oy};S.sheet=null;toast("Photo framed and optimised");render(true);}

function decodeImage(file){S.admin.scan=null;S.sheet={type:"processing",msg:"Reading the pass…"};render(true);
  const fail=()=>{S.admin.scan={err:"No QR code found",sub:"Hold the phone closer, keep the code flat and in focus, then try again."};S.sheet={type:"scanres"};render(true);};
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{setTimeout(()=>{try{
      const tries=[[1,1200],[1,800],[0.6,1000],[0.4,800],[1,1700]];
      for(const [crop,max] of tries){const cw=img.width*crop,ch=img.height*crop,sx=(img.width-cw)/2,sy=(img.height-ch)/2;const k=Math.min(1,max/Math.max(cw,ch));const w=Math.max(1,Math.round(cw*k)),h=Math.max(1,Math.round(ch*k));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(img,sx,sy,cw,ch,0,0,w,h);const dd=cx.getImageData(0,0,w,h);
        const res=window.jsQR?window.jsQR(dd.data,w,h,{inversionAttempts:"attemptBoth"}):null;if(res&&res.data){showScan(res.data);return;}}
      fail();}catch(err){fail();}},30);};img.onerror=fail;img.src=fr.result;};fr.onerror=fail;fr.readAsDataURL(file);}

function supaShim(sb){
  const subs={};
  function fetchAll(table){return sb.from(table).select("id,data").then(({data,error})=>{if(error)throw error;return (data||[]).map(r=>({id:r.id,exists:true,data:()=>r.data}));});}
  return {
    collection(table){return {onSnapshot(next,err){const run=()=>fetchAll(table).then(docs=>next({docs,size:docs.length,empty:!docs.length})).catch(e=>err&&err(e));run();
      const ch=sb.channel("rt-"+table).on("postgres_changes",{event:"*",schema:"public",table},()=>{clearTimeout(subs[table]);subs[table]=setTimeout(run,150);}).subscribe();return ()=>sb.removeChannel(ch);}};},
    doc(path){const [table,id]=path.split("/");return {
      set:v=>sb.from(table).upsert({id,data:v,updated_at:new Date().toISOString()}).then(({error})=>{if(error)throw error;}),
      update:patch=>sb.from(table).select("data").eq("id",id).maybeSingle().then(({data,error})=>{if(error)throw error;const cur=(data&&data.data)||{};return sb.from(table).update({data:Object.assign({},cur,patch),updated_at:new Date().toISOString()}).eq("id",id).then(({error:e2})=>{if(e2)throw e2;});}),
      delete:()=>sb.from(table).delete().eq("id",id).then(({error})=>{if(error)throw error;}),
      onSnapshot(next,err){const run=()=>sb.from(table).select("data").eq("id",id).maybeSingle().then(({data,error})=>{if(error)throw error;next({id,exists:!!data,data:()=>data?data.data:undefined});}).catch(e=>err&&err(e));run();
        const ch=sb.channel("rt-"+table+"-"+id).on("postgres_changes",{event:"*",schema:"public",table,filter:"id=eq."+id},()=>setTimeout(run,100)).subscribe();return ()=>sb.removeChannel(ch);}};}};}

  askdelete(id){const e=ev(id);S.sheet={type:"confirm",title:"Delete “"+esc(e.title)+"”?",text:"This permanently removes the event, its "+DB.regs.filter(r=>r.eventId===id).length+" registrations and its waiting list. Archive it instead to keep the history.",act:"deleteevent",arg:id,label:"Delete",danger:1};render(true);},
  deleteevent(id){const e=ev(id);DB.events=DB.events.filter(x=>x.id!==id);DB.regs=DB.regs.filter(r=>r.eventId!==id);DB.waitlist=DB.waitlist.filter(w=>w.eventId!==id);audit("Deleted event",e.title);S.sheet=null;toast("Event deleted");render(true);},
  cancelh(v){S.admin.draft.cancelHours=+v;render(true);},
  addtier(){const d=S.admin.draft;d.tiersManual=true;const s=sortTiers(d.tiers);const last=s[s.length-1];const from=last?addD(last.until,1):S.today;d.tiers.push({id:uid("t"),label:"New period",from,until:addD(from,6),emp:last?last.emp+5:20,guest:last?last.guest+5:30,lunchOn:last?!!last.lunchOn:false,lunchPrice:last&&last.lunchPrice!=null?last.lunchPrice:15});render(true);},
  deltier(id){const d=S.admin.draft;d.tiersManual=true;if(d.tiers.length<=1){toast("Keep at least one price period");return;}d.tiers=d.tiers.filter(x=>x.id!==id);render(true);},
  clearimg(){S.admin.draft.image=null;S.admin.draft.imageOrig=null;render(true);},
  savedraft(){saveDraft("draft");},
  publish(){saveDraft("published");},
  previewev(){const d=S.admin.draft;if(validateTiers(d.tiers)){toast("Fix pricing first");return;}S.sheet={type:"preview",event:clone(d)};render(true);},
  regfilter(f){S.admin.regFilter=f;render(true);},
  aregview(id){S.sheet={type:"adminreg",regId:id};render(true);},
  contact(uid_){S.sheet={type:"contact",userId:uid_};render(true);},
  markpaid(id){const r=DB.regs.find(x=>x.id===id);r.payment="paid";persist(r);notifyMail(r.id,"paid");audit("Marked payment as paid",ev(r.eventId).title+" · "+user(r.userId).first+" "+user(r.userId).last);toast("Marked as paid");render(true);},
  refund(id){const r=DB.regs.find(x=>x.id===id);r.payment="refunded";persist(r);audit("Marked payment as refunded",ev(r.eventId).title+" · "+user(r.userId).first+" "+user(r.userId).last);toast("Recorded as refunded");render(true);},
  setpay(arg){const [id,p]=arg.split(":");const r=DB.regs.find(x=>x.id===id);r.payment=p;persist(r);audit("Changed payment to "+p,ev(r.eventId).title+" · "+user(r.userId).first);toast("Payment status updated");render(true);},
  acancelreg(id){S.sheet={type:"confirm",title:"Cancel this registration?",text:"The spot is released"+(DB.settings.autoPromote?" and the first person on the waiting list is promoted.":". You can then promote someone from the waiting list."),act:"doacancel",arg:id,label:"Cancel registration",danger:1};render(true);},
  doacancel(id){const r=DB.regs.find(x=>x.id===id);r.status="cancelled";persist(r);const e=ev(r.eventId);audit("Cancelled registration",e.title+" · "+user(r.userId).first+" "+user(r.userId).last);let m="Registration cancelled";if(DB.settings.autoPromote&&waitOf(e).length){promote(waitOf(e)[0].id);m+=" · next player promoted";}S.sheet=null;toast(m);render(true);},
  promote(id){const w=DB.waitlist.find(x=>x.id===id);const e=ev(w.eventId);if(taken(e)>=e.capacity){S.sheet={type:"confirm",title:"Event is full",text:"Promoting adds a player above capacity ("+(taken(e)+1)+" / "+e.capacity+"). Continue?",act:"forcepromote",arg:id,label:"Promote anyway"};render(true);return;}promote(id);toast("Promoted to confirmed");render(true);},
  forcepromote(id){promote(id);S.sheet=null;toast("Promoted to confirmed");render(true);},
  removewait(id){const w=DB.waitlist.find(x=>x.id===id);DB.waitlist=DB.waitlist.filter(x=>x.id!==id);audit("Removed from waiting list",ev(w.eventId).title+" · "+user(w.userId).first);toast("Removed from waiting list");render(true);},
  tpl(k){S.admin.commTpl=k;S.admin.commText=null;render(true);},
  tplreset(){S.admin.commText=null;render(true);},
  copymsg(){copyText(S.admin.commText,"msgbox");},
  coststate(k){DB.costs[S.admin.budgetEvent].state=k;render(true);},
  savecosts(){audit("Updated actual costs",ev(S.admin.budgetEvent).title);toast("Costs saved");render(true);},
  anascope(k){S.admin.anaScope=k;render(true);},
  docheckin(){const a=S.admin;if(a.ciCode.trim()){const t=a.ciCode.trim();a.ciCode="";showScan(t);return;}const c=(a.ciCode||"").trim().toUpperCase();const r=DB.regs.find(x=>x.code===c&&live(x));
    if(!r)a.ciMsg={ok:false,t:"No registration found for "+(c||"an empty code")+"."};else if(r.eventId!==a.ciEvent)a.ciMsg={ok:false,t:"This pass is for "+ev(r.eventId).title+"."};else if(r.checkedIn)a.ciMsg={ok:false,t:user(r.userId).first+" is already checked in."};else{r.checkedIn=true;a.ciMsg={ok:true,t:user(r.userId).first+" "+user(r.userId).last+" checked in."};audit("Checked in",ev(r.eventId).title+" · "+user(r.userId).first);}
    a.ciCode="";render(true);},
  togglecheck(id){const r=DB.regs.find(x=>x.id===id);r.checkedIn=!r.checkedIn;r.checkedAt=r.checkedIn?new Date().toTimeString().slice(0,5):"";persist(r);render(true);},
  savesettings(){audit("Updated settings","Assumptions & budget model");toast("Settings saved");render(true);},
  askreset(){S.sheet={type:"confirm",title:"Reset demo data?",text:"All changes made in this session are discarded and the sample season is restored.",act:"reset",arg:"",label:"Reset",danger:1};render(true);},
  reset(){DB=seed();applyAccount();S.sheet=null;S.feedback={};toast("Demo data restored");render(true);},
  addline(){DB.budget.lines.push({id:uid("bl"),label:"New line",amount:0});render(true);},
  delline(id){DB.budget.lines=DB.budget.lines.filter(l=>l.id!==id);audit("Removed budget line","Budget plan");render(true);},
  expfilter(f){S.admin.expFilter=f;render(true);},
  addexp(){const n=S.admin.newExp;const amt=+String(n.amount).replace(/[^0-9.]/g,"");if(!n.label.trim()||!amt){toast("Add a description and an amount");return;}DB.expenses.push(Object.assign({id:uid("x"),date:n.date||S.today,label:n.label.trim(),category:n.category,eventId:n.eventId,amount:amt,status:n.status},S.admin.page==="sbudget"&&n.sport?{sport:n.sport}:{}));audit("Added expense",n.label+" · "+chf(amt));S.admin.newExp=null;toast("Expense added");render(true);},
  expstatus(id){const x=DB.expenses.find(y=>y.id===id);x.status=x.status==="spent"?"committed":"spent";render(true);},
  delexp(id){const x=DB.expenses.find(y=>y.id===id);DB.expenses=DB.expenses.filter(y=>y.id!==id);audit("Deleted expense",x.label);toast("Expense deleted");render(true);},
  newmember(){S.sheet={type:"member",isNew:true,m:{id:"u"+Date.now(),first:"",last:"",email:"",phone:"",dept:"",level:"Beginner"}};render(true);},
  editmember(id){S.sheet={type:"member",isNew:false,m:clone(user(id))};render(true);},
  savemember(){const s=S.sheet,m=s.m;if(!m.first.trim()||!m.last.trim()){s.err="Add a first and last name.";render(true);return;}if(!/@/.test(m.email)){s.err="Add a valid email address.";render(true);return;}const i=DB.users.findIndex(u=>u.id===m.id);if(i>=0)DB.users[i]=clone(m);else DB.users.push(clone(m));audit(s.isNew?"Added member":"Edited member",m.first+" "+m.last);S.sheet=null;toast(s.isNew?"Member added":"Member saved");render(true);},
  askdelmember(id){const u=user(id);const n=DB.regs.filter(r=>r.userId===id&&live(r)).length;S.sheet={type:"confirm",title:"Remove "+esc(u.first+" "+u.last)+"?",text:n?"Their "+n+" booking"+(n>1?"s are":" is")+" cancelled and they leave all waiting lists.":"They have no bookings.",act:"delmember",arg:id,label:"Remove",danger:1};render(true);},
  delmember(id){const u=user(id);DB.regs.forEach(r=>{if(r.userId===id)r.status="cancelled";});DB.waitlist=DB.waitlist.filter(w=>w.userId!==id);DB.users=DB.users.filter(x=>x.id!==id);audit("Removed member",u.first+" "+u.last);S.sheet=null;toast("Member removed");render(true);},
  addregfor(id){S.sheet={type:"addreg",userId:id||DB.users[0].id,eventId:S.admin.page==="regs"?S.admin.regEvent:null,price:null,pay:"unpaid"};render(true);},
  saveaddreg(){const s=S.sheet;const e=ev(s.eventId);if(!e){s.err="Choose an event.";render(true);return;}if(DB.regs.some(r=>r.eventId===e.id&&r.userId===s.userId&&live(r))){s.err="This member is already booked for this event.";render(true);return;}const ti=tierAt(e)||sortTiers(e.tiers).slice(-1)[0];
    DB.regs.push({id:uid("r"),eventId:e.id,userId:s.userId,guests:[],tier:"Set by organiser",emp:+s.price||0,guestPrice:ti.guest,total:+s.price||0,status:"confirmed",payment:s.pay,createdAt:S.today,lunch:!!(e.lunch||e.food),diet:"",equipment:false,code:code(),checkedIn:false,feedback:null});
    DB.waitlist=DB.waitlist.filter(w=>!(w.eventId===e.id&&w.userId===s.userId));audit("Added booking",e.title+" · "+user(s.userId).first+" "+user(s.userId).last);S.sheet=null;toast("Booking added");render(true);},
  addfaq(){DB.content.faq.push({q:"New question",a:""});render(true);},
  delfaq(i){i=+i;DB.content.faq.splice(i,1);const T=DB.content.tr;if(T)["fr","de"].forEach(l=>{const f=T[l]&&T[l].faq;if(f){const n={};Object.keys(f).forEach(k=>{k=+k;if(k<i)n[k]=f[k];else if(k>i)n[k-1]=f[k];});T[l].faq=n;}});render(true);},
  addvenue(){DB.venues.push({id:uid("v"),name:"New venue",address:"",sports:isSuper()?[]:adminScope().slice()});render(true);},
  venuesport(arg){const [id,sp]=String(arg).split(":");const v=DB.venues.find(x=>x.id===id);if(!v)return;v.sports=v.sports||[];const i=v.sports.indexOf(sp);if(i<0)v.sports.push(sp);else v.sports.splice(i,1);render(true);},
  delvenue(id){DB.venues=DB.venues.filter(v=>v.id!==id);render(true);},
  settoday(d){S.today=d;audit("Changed test date",fmt(d,"long"));toast("Today is now "+fmt(d,"dm"));render(true);},
  image(){}
};
Object.assign(A,OBA);
function promote(wid){const w=DB.waitlist.find(x=>x.id===wid);const e=ev(w.eventId);const ti=tierAt(e)||sortTiers(e.tiers).slice(-1)[0];
  DB.regs.push({id:uid("r"),eventId:e.id,userId:w.userId,guests:[],tier:ti.label,emp:ti.emp,guestPrice:ti.guest,total:ti.emp,status:"confirmed",payment:"unpaid",createdAt:S.today,lunch:false,diet:"",equipment:false,code:code(),checkedIn:false,feedback:null});
  DB.waitlist=DB.waitlist.filter(x=>x.id!==wid);audit("Promoted from waiting list",e.title+" · "+user(w.userId).first+" "+user(w.userId).last);}
function saveDraft(status){const d=S.admin.draft;if(d.tr&&!(d.title||"").trim()){for(const l of ["fr","de"]){if(d.tr[l]&&(d.tr[l].title||"").trim()){d.title=d.tr[l].title;break;}}}if(!d.title.trim()){toast("Add an event name first");return;}const err=validateTiers(d.tiers);if(err&&status==="published"){toast("Fix pricing first");return;}
  d.status=status==="published"?(d.status==="cancelled"?"cancelled":"published"):"draft";d.capacity=+d.capacity||1;
  const i=DB.events.findIndex(e=>e.id===d.id);if(i>=0)DB.events[i]=clone(d);else DB.events.push(clone(d));
  audit(status==="published"?"Published event":"Saved draft",d.title);toast(status==="published"?"Published":"Draft saved");render(true);}
function flashCopied(el){const btn=el&&(el.closest?el.closest("button"):el);if(!btn||btn._cf)return;btn._cf=true;const orig=btn.innerHTML;btn.classList.add("copied");btn.innerHTML=ic("check",'style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"')+"Copied";setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove("copied");btn._cf=false;},1700);}
function copyText(txt,selId,onOk){txt=txl(txt);const ok=()=>{if(onOk)onOk();else toast("Copied");};const fail=()=>{const el=selId&&document.getElementById(selId);if(el&&el.select){el.focus();el.select();}toast(selId?"Text selected — copy it from the box":"Copy unavailable here");};
  try{navigator.clipboard.writeText(txt).then(ok,fail);}catch(err){fail();}}
function applyTheme(){if(S.theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);}

document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT")return;if(el.tagName==="A")return;e.preventDefault();const f=A[el.dataset.act];if(f){try{const r=f(el.dataset.arg,el);if(r&&r.catch)r.catch(showErr);}catch(err){showErr(err);}}});
window.addEventListener("error",e=>{if(e&&e.error)showErr(e.error);});window.addEventListener("unhandledrejection",e=>showErr(e.reason));
document.addEventListener("input",e=>{const el=e.target;const b=el.dataset&&el.dataset.bind;if(!b)return;
  if(el.dataset.fmt==="card"){const d=el.value.replace(/\D/g,"").slice(0,16);el.value=d.replace(/(.{4})/g,"$1 ").trim();}
  if(el.dataset.fmt==="exp"){let d=el.value.replace(/\D/g,"").slice(0,4);if(d.length>2)d=d.slice(0,2)+"/"+d.slice(2);el.value=d;}
  let v=el.type==="checkbox"?el.checked:el.value;if(el.dataset.num)v=v===""?0:+v;setPath(b,v);
  if(/^sheet\.(lunch|guests\.\d+\.lunch)$/.test(b)&&S.sheet&&S.sheet.type==="register"){const bt=document.querySelector('[data-act="step"][data-arg="2"]');if(bt)bt.textContent="Continue to payment · "+chf(bookTotal(ev(S.sheet.evId),S.sheet));}
  if(b==="prefs.showName"){DB.regs.filter(r=>r.userId===S.me).forEach(r=>{r.show=!!v;persist(r);});}
  if(b==="sheet.accept"){const btn=document.getElementById("confirmbtn");if(btn)btn.disabled=!v;}
  if(b.startsWith("tier.")||b==="admin.draft.guestAllowed"){const d=S.admin.draft;const lp=document.getElementById("livepreview");if(lp){const er=validateTiers(d.tiers);lp.innerHTML=er?'<div class="notice n-bad">'+ic("warn")+'<div>'+esc(er.msg)+'</div></div>':pricing(d);const pb=document.querySelector('[data-act="publish"]');if(pb)pb.disabled=!!er;}}
  if(b==="sheet.eventId"&&S.sheet)S.sheet.price=null;
  if(el.dataset.rerender==="1"&&el.tagName==="SELECT"){if(b==="admin.ciEvent")S.admin.ciMsg=null;render(true);}
  if(el.type==="checkbox"&&b.startsWith("admin.draft."))render(true);
});
document.addEventListener("focusout",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.bind==="today"&&el.type==="date"){render(true);}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.act==="toggledemo"){A.toggledemo();return;}
  if((el.type==="time"||el.type==="date")&&el.dataset&&el.dataset.bind==="today"){return;}
  if(el.dataset&&el.dataset.rerender==="1"&&el.tagName==="INPUT"){render(true);const n=document.querySelector('[data-bind="'+el.dataset.bind+'"]');if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length);}catch(err){}}}
  if(el.dataset&&el.dataset.rerender==="blur")render(true);
  if(el.type==="time"||el.type==="date")return;
  if(el.dataset&&(el.dataset.bind||"").startsWith("admin.draft.")&&el.tagName!=="TEXTAREA"&&el.type!=="checkbox"&&el.type!=="text"&&!el.dataset.num)render(true);
  if(el.dataset&&el.dataset.actChange==="scan"&&el.files&&el.files[0]){decodeImage(el.files[0]);el.value="";return;}
  if(el.dataset&&el.dataset.actChange==="venue"&&el.value){const v=DB.venues.find(x=>x.id===el.value);if(v){S.admin.draft.venue=v.name;S.admin.draft.address=v.address;render(true);}return;}
  if(el.dataset&&el.dataset.actChange==="image"&&el.files&&el.files[0]){openCrop(el.files[0]);el.value="";return;}if(false){const f=null;const rd=new FileReader();rd.onload=()=>{S.admin.draft.image=rd.result;render(true);};rd.readAsDataURL(f);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".scanner")){closeScanner();return;}if(S.sheet&&S.sheet.type==="pin"){if(/^[0-9]$/.test(e.key)){A.pin(e.key);return;}if(e.key==="Backspace"){A.pin("del");return;}}if(e.key==="Escape"&&S.sheet){S.sheet=null;render(true);}if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("hero")){A.open(e.target.dataset.arg);}if(e.key==="Enter"&&e.target.id==="cicode"){A.docheckin();}});

i18nStart();
try{const th=localStorage.getItem("sqpc-theme");if(th)S.theme=th;}catch(err){}
if(HOSTED&&!CFG.demo){setDemo(false,true);DB.events=DB.events.filter(e=>!e.sample);mergeDefaults();}loadLocal();if(!AUTH){loadAccount();applyAccount();}applyTheme();if(AUTH){S.authPending=true;try{const t=CFG.today||new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());if(/^\d{4}-\d{2}-\d{2}$/.test(t))S.today=t;}catch(err){}}render();routeHash();if(AUTH)authInit();else initLive();window.addEventListener("hashchange",routeHash);
})();
</script>
